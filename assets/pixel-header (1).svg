<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="45%" stop-color="#1a0e3d"/>
      <stop offset="100%" stop-color="#0a0118"/>
    </linearGradient>

    <linearGradient id="neonPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2fa8"/>
      <stop offset="50%" stop-color="#ff7ae0"/>
      <stop offset="100%" stop-color="#ff2fa8"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f6ff"/>
      <stop offset="50%" stop-color="#7afcff"/>
      <stop offset="100%" stop-color="#00f6ff"/>
    </linearGradient>

    <pattern id="pixelGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <rect width="1" height="8" fill="#ffffff" opacity="0.04"/>
      <rect width="8" height="1" fill="#ffffff" opacity="0.04"/>
    </pattern>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.10"/>
    </pattern>

    <filter id="pxGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="260"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#pixelGrid)"/>

    <g fill="#3a1f6e" opacity="0.5">
      <g>
        <rect x="0" y="30" width="24" height="8"/>
        <rect x="24" y="22" width="24" height="8"/>
        <rect x="48" y="30" width="24" height="8"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 1200,0" dur="18s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="300" y="16" width="18" height="6"/>
        <rect x="318" y="10" width="18" height="6"/>
        <rect x="336" y="16" width="18" height="6"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 1200,0" dur="24s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="700" y="24" width="20" height="7"/>
        <rect x="720" y="17" width="20" height="7"/>
        <rect x="740" y="24" width="20" height="7"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 1200,0" dur="21s" begin="-6s" repeatCount="indefinite"/>
      </g>
    </g>

    <g fill="#ffffff">
      <rect x="48" y="30" width="4" height="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="140" y="60" width="3" height="3"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></rect>
      <rect x="90" y="200" width="3" height="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="1120" y="24" width="4" height="4"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="1060" y="70" width="3" height="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="1150" y="200" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/></rect>
      <rect x="1000" y="220" width="3" height="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></rect>
      <rect x="200" y="230" width="3" height="3"><animate attributeName="opacity" values="1;0.3;1" dur="1.7s" repeatCount="indefinite"/></rect>
    </g>

    <g fill="#2a1458">
      <rect x="0" y="228" width="1200" height="4"/>
      <rect x="0" y="232" width="1200" height="4" opacity="0.7"/>
    </g>
    <g fill="#4b2a8a" opacity="0.55">
      <rect x="60" y="212" width="16" height="16"/>
      <rect x="76" y="204" width="16" height="16"/>
      <rect x="92" y="212" width="16" height="16"/>
      <rect x="1040" y="212" width="16" height="16"/>
      <rect x="1056" y="200" width="16" height="16"/>
      <rect x="1072" y="212" width="16" height="16"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="-30,0; 1230,0" dur="9s" repeatCount="indefinite"/>
      <g fill="#00f6ff">
        <rect x="0" y="200" width="6" height="6"/>
        <rect x="6" y="194" width="6" height="6"/>
        <rect x="12" y="200" width="6" height="6"/>
        <rect x="6" y="206" width="6" height="12">
          <animate attributeName="height" values="12;6;12" dur="0.3s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <g>
      <rect x="70" y="40" width="1060" height="180" fill="#150a30" stroke="#ff2fa8" stroke-width="4">
        <animate attributeName="stroke" values="#ff2fa8;#00f6ff;#ff2fa8" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="80" y="50" width="1040" height="160" fill="none" stroke="#00f6ff" stroke-width="2" opacity="0.8"/>
      <g fill="#ffffff">
        <rect x="66" y="36" width="8" height="8"/>
        <rect x="1126" y="36" width="8" height="8"/>
        <rect x="66" y="216" width="8" height="8"/>
        <rect x="1126" y="216" width="8" height="8"/>
      </g>
    </g>

    <g transform="translate(112,88)">
      <rect width="88" height="88" fill="#ff2fa8" opacity="0.15"/>
      <g fill="#ffe1f6">
        <rect x="8" y="8" width="72" height="72"/>
      </g>
      <g fill="#2a1458">
        <rect x="8" y="8" width="72" height="8"/>
        <rect x="8" y="72" width="72" height="8"/>
        <rect x="8" y="8" width="8" height="72"/>
        <rect x="72" y="8" width="8" height="72"/>
        <rect x="24" y="32" width="10" height="10"/>
        <rect x="54" y="32" width="10" height="10"/>
        <rect x="24" y="54" width="40" height="8"/>
      </g>
      <animateTransform attributeName="transform" type="translate"
        values="112,88; 112,80; 112,88" dur="2.4s" repeatCount="indefinite"/>
    </g>

    <text x="640" y="116" text-anchor="middle"
          font-family="'Press Start 2P', ui-monospace, 'Courier New', monospace"
          font-size="34" fill="url(#neonPink)" letter-spacing="4" filter="url(#pxGlow)">
      OUSSAMA TARIGHT
      <animate attributeName="opacity" values="1;0.85;1" dur="2.6s" repeatCount="indefinite"/>
    </text>

    <text x="640" y="156" text-anchor="middle"
          font-family="'Press Start 2P', ui-monospace, 'Courier New', monospace"
          font-size="14" fill="url(#neonCyan)" letter-spacing="3" opacity="0.95">
      FULL-STACK DEVELOPER
    </text>

    <text x="640" y="182" text-anchor="middle"
          font-family="'Press Start 2P', ui-monospace, 'Courier New', monospace"
          font-size="12" fill="#ffe1f6" letter-spacing="2" opacity="0.8">
      COMPUTER SCIENCE @ USTHB
    </text>

    <rect x="912" y="168" width="10" height="16" fill="#00f6ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(96,196)">
      <rect x="0" y="0" width="1008" height="6" fill="#150a30" stroke="#2b3a66" stroke-width="1"/>
      <rect y="0" width="0" height="6" fill="url(#neonCyan)">
        <animate attributeName="width" values="0;1008;0" dur="4.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="1032" y="86" text-anchor="middle"
          font-family="'Press Start 2P', ui-monospace, 'Courier New', monospace"
          font-size="9" fill="#ffe94a" letter-spacing="1">
      PRESS START
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </text>

    <rect x="70" y="40" width="1060" height="180" fill="url(#scanlines)"/>
  </g>
</svg>
