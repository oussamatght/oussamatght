<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="45%" stop-color="#1a0e3d"/>
      <stop offset="100%" stop-color="#0a0118"/>
    </linearGradient>

    <linearGradient id="neonPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2fa8"/>
      <stop offset="50%" stop-color="#ff7ae0"/>
      <stop offset="100%" stop-color="#ff2fa8"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f6ff"/>
      <stop offset="50%" stop-color="#7afcff"/>
      <stop offset="100%" stop-color="#00f6ff"/>
    </linearGradient>

    <pattern id="pixelGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <rect width="1" height="8" fill="#ffffff" opacity="0.04"/>
      <rect width="8" height="1" fill="#ffffff" opacity="0.04"/>
    </pattern>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.10"/>
    </pattern>

    <filter id="pxGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#pixelGrid)"/>

  <!-- pixel stars -->
  <g fill="#ffffff">
    <rect x="48" y="30" width="4" height="4" opacity="0.9"/>
    <rect x="140" y="60" width="3" height="3" opacity="0.6"/>
    <rect x="90" y="200" width="3" height="3" opacity="0.7"/>
    <rect x="1120" y="24" width="4" height="4" opacity="0.9"/>
    <rect x="1060" y="70" width="3" height="3" opacity="0.5"/>
    <rect x="1150" y="200" width="4" height="4" opacity="0.8"/>
    <rect x="1000" y="220" width="3" height="3" opacity="0.6"/>
    <rect x="200" y="230" width="3" height="3" opacity="0.5"/>
  </g>

  <!-- pixel mountains / floor motif -->
  <g fill="#2a1458">
    <rect x="0" y="228" width="1200" height="4"/>
    <rect x="0" y="232" width="1200" height="4" opacity="0.7"/>
  </g>
  <g fill="#4b2a8a" opacity="0.55">
    <rect x="60" y="212" width="16" height="16"/>
    <rect x="76" y="204" width="16" height="16"/>
    <rect x="92" y="212" width="16" height="16"/>
    <rect x="1040" y="212" width="16" height="16"/>
    <rect x="1056" y="200" width="16" height="16"/>
    <rect x="1072" y="212" width="16" height="16"/>
  </g>

  <!-- outer pixel border (double-stroke retro window) -->
  <g>
    <rect x="70" y="40" width="1060" height="180" fill="#150a30" stroke="#ff2fa8" stroke-width="4"/>
    <rect x="80" y="50" width="1040" height="160" fill="none" stroke="#00f6ff" stroke-width="2" opacity="0.8"/>
    <!-- corner pixel studs -->
    <g fill="#ffffff">
      <rect x="66" y="36" width="8" height="8"/>
      <rect x="1126" y="36" width="8" height="8"/>
      <rect x="66" y="216" width="8" height="8"/>
      <rect x="1126" y="216" width="8" height="8"/>
    </g>
  </g>

  <!-- pixel avatar block (8-bit face) -->
  <g transform="translate(112,88)">
    <rect width="88" height="88" fill="#ff2fa8" opacity="0.15"/>
    <g fill="#ffe1f6">
      <rect x="8" y="8" width="72" height="72"/>
    </g>
    <g fill="#2a1458">
      <rect x="8" y="8" width="72" height="8"/>
      <rect x="8" y="72" width="72" height="8"/>
      <rect x="8" y="8" width="8" height="72"/>
      <rect x="72" y="8" width="8" height="72"/>
      <rect x="24" y="32" width="10" height="10"/>
      <rect x="54" y="32" width="10" height="10"/>
      <rect x="24" y="54" width="40" height="8"/>
    </g>
    <animateTransform attributeName="transform" type="translate"
      values="112,88; 112,82; 112,88" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- title text, pixel/mono styled -->
  <text x="640" y="116" text-anchor="middle"
        font-family="'Press Start 2P', ui-monospace, 'Courier New', monospace"
        font-size="34" fill="url(#neonPink)" letter-spacing="4" filter="url(#pxGlow)">
    OUSSAMA TARIGHT
  </text>

  <text x="640" y="156" text-anchor="middle"
        font-family="'Press Start 2P', ui-monospace, 'Courier New', monospace"
        font-size="14" fill="url(#neonCyan)" letter-spacing="3" opacity="0.95">
    FULL-STACK DEVELOPER
  </text>

  <text x="640" y="182" text-anchor="middle"
        font-family="'Press Start 2P', ui-monospace, 'Courier New', monospace"
        font-size="12" fill="#ffe1f6" letter-spacing="2" opacity="0.8">
    COMPUTER SCIENCE @ USTHB
  </text>

  <!-- blinking pixel cursor -->
  <rect x="912" y="168" width="10" height="16" fill="#00f6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- scanline overlay -->
  <rect x="70" y="40" width="1060" height="180" fill="url(#scanlines)"/>
</svg>
